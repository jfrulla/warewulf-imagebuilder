[defaults]
# Required: the image build is a chain of handlers, and a failure mid-chain must
# not leave notified handlers pending.
force_handlers=True
host_key_checking=False
inventory = ./inventory
collections_path = ./collections
roles_path = ./roles

# Point this at the key used to encrypt inventory/group_vars/*/secrets.yml and *.vault files.
# vault_password_file = /path/to/ansible-vault.key

[callback_default]
result_format = yaml

[privilege_escalation]
become=True
become_method=sudo

[ssh_connection]
pipelining=True
