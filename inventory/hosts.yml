---
# Phony inventory. ww-control-node is the Warewulf control node (the host that runs
# wwctl and apptainer). Replace the address and group name with your own.
all:
  vars:
    ansible_user: root
    ansible_ssh_private_key_file: "~/.ssh/id_ed25519"

head:
  children:
    example_cluster:
      hosts:
        ww-control-node:
          ansible_host: 192.0.2.10
