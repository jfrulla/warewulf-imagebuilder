---
# The build pipeline is a chain of handlers. Tasks only stage files and notify;
# each handler notifies the next step. ansible.cfg must set force_handlers=True
# so a failure mid-chain does not leave notified handlers pending.

- name: "Remove previous sandbox build ({{ image_name }})"
  ansible.builtin.file:
    path: "{{ sandbox_dest }}"
    state: absent
  changed_when: true
  notify:
    - "Build image sandbox ({{ image_name }})"

- name: "Build image sandbox ({{ image_name }})"
  ansible.builtin.command: "apptainer build --sandbox --force {{ sandbox_dest }} {{ definition_dest }}"
  changed_when: true
  notify:
    - "Import image sandbox into Warewulf ({{ image_name }})"

- name: "Import image sandbox into Warewulf ({{ image_name }})"
  ansible.builtin.command: "wwctl image import --force {{ sandbox_dest }} {{ image_name }}"
  changed_when: true
  notify:
    - "Build image VNFS ({{ image_name }})"

- name: "Build image VNFS ({{ image_name }})"
  ansible.builtin.command: "wwctl image build --force {{ image_name }}"
  changed_when: true
